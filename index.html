<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azan Clothing Store - Classic Fashion Brand</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@400;700&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #f5f5f5;
            color: #333;
            line-height: 1.6;
        }

        /* ========== SPLASH / WELCOME SCREEN ========== */
        .splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 99999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #000 0%, #1a1a1a 25%, #0d0d0d 50%, #1a1a1a 75%, #000 100%);
            overflow: hidden;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        .splash-screen.hide {
            opacity: 0;
            visibility: hidden;
        }

        .splash-screen::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 80%, rgba(212, 175, 55, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(212, 175, 55, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(212, 175, 55, 0.05) 0%, transparent 70%);
            animation: bgPulse 4s ease-in-out infinite;
        }

        @keyframes bgPulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        .splash-border {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            bottom: 20px;
            border: 2px solid transparent;
            background: linear-gradient(#000, #000) padding-box,
                        linear-gradient(45deg, #d4af37, #f5e6a3, #d4af37) border-box;
            animation: borderGlow 3s linear infinite;
        }

        @keyframes borderGlow {
            0% { filter: drop-shadow(0 0 5px rgba(212, 175, 55, 0.5)); }
            50% { filter: drop-shadow(0 0 20px rgba(212, 175, 55, 0.8)); }
            100% { filter: drop-shadow(0 0 5px rgba(212, 175, 55, 0.5)); }
        }

        .splash-content {
            position: relative;
            z-index: 1;
            text-align: center;
        }

        .sparkle {
            position: absolute;
            width: 10px;
            height: 10px;
            background: #d4af37;
            border-radius: 50%;
            animation: sparkle 2s ease-in-out infinite;
        }

        .sparkle:nth-child(1) { top: 10%; left: 10%; animation-delay: 0s; }
        .sparkle:nth-child(2) { top: 20%; right: 15%; animation-delay: 0.3s; }
        .sparkle:nth-child(3) { bottom: 15%; left: 20%; animation-delay: 0.6s; }
        .sparkle:nth-child(4) { bottom: 25%; right: 10%; animation-delay: 0.9s; }
        .sparkle:nth-child(5) { top: 40%; left: 5%; animation-delay: 1.2s; }
        .sparkle:nth-child(6) { top: 50%; right: 5%; animation-delay: 1.5s; }

        @keyframes sparkle {
            0%, 100% { transform: scale(0); opacity: 0; }
            50% { transform: scale(1); opacity: 1; }
        }

        .splash-logo {
            font-family: 'Great Vibes', cursive;
            font-size: 120px;
            font-weight: bold;
            background: linear-gradient(135deg, #d4af37 0%, #f5e6a3 25%, #d4af37 50%, #f5e6a3 75%, #d4af37 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shine 2s linear infinite;
            filter: drop-shadow(0 0 30px rgba(212, 175, 55, 0.6));
            margin-bottom: 20px;
        }

        @keyframes shine {
            to { background-position: 200% center; }
        }

        .welcome-text {
            font-family: 'Playfair Display', serif;
            font-size: 18px;
            color: #fff;
            letter-spacing: 10px;
            text-transform: uppercase;
            margin-bottom: 10px;
            animation: fadeInUp 1s ease 0.5s both;
        }

        .brand-name {
            font-family: 'Playfair Display', serif;
            font-size: 48px;
            color: #d4af37;
            font-weight: 700;
            letter-spacing: 5px;
            margin-bottom: 20px;
            animation: fadeInUp 1s ease 0.8s both;
        }

        .welcome-message {
            font-family: 'Poppins', sans-serif;
            font-size: 24px;
            color: #fff;
            font-weight: 300;
            animation: fadeInUp 1s ease 1.1s both;
        }

        .welcome-message .highlight {
            color: #d4af37;
            font-weight: 600;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .loading-bar {
            width: 200px;
            height: 3px;
            background: rgba(212, 175, 55, 0.2);
            margin: 40px auto 0;
            border-radius: 3px;
            overflow: hidden;
        }

        .loading-bar::after {
            content: '';
            display: block;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #d4af37, #f5e6a3, #d4af37);
            animation: loading 2s ease-in-out forwards;
        }

        @keyframes loading {
            from { width: 0; }
            to { width: 100%; }
        }

        .crown {
            font-size: 40px;
            color: #d4af37;
            margin-bottom: 20px;
            animation: bounce 2s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* ========== FLOATING WHATSAPP BUTTON ========== */
        .whatsapp-float {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 9999;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .whatsapp-text {
            background: #25D366;
            color: #fff;
            padding: 12px 20px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 600;
            box-shadow: 0 5px 20px rgba(37, 211, 102, 0.4);
            white-space: nowrap;
            opacity: 0;
            transform: translateX(20px);
            transition: all 0.3s ease;
        }

        .whatsapp-float:hover .whatsapp-text {
            opacity: 1;
            transform: translateX(0);
        }

        .whatsapp-btn {
            width: 60px;
            height: 60px;
            background: #25D366;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 25px rgba(37, 211, 102, 0.5);
            transition: all 0.3s ease;
            text-decoration: none;
            animation: pulse-whatsapp 2s infinite;
        }

        .whatsapp-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 35px rgba(37, 211, 102, 0.7);
        }

        .whatsapp-btn i {
            font-size: 32px;
            color: #fff;
        }

        @keyframes pulse-whatsapp {
            0% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.5); }
            70% { box-shadow: 0 0 0 20px rgba(37, 211, 102, 0); }
            100% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0); }
        }

        /* ========== SEARCH BAR ========== */
        .search-container {
            position: relative;
            margin-left: 20px;
        }

        .search-toggle {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            padding: 8px 15px;
            transition: color 0.3s;
        }

        .search-toggle:hover {
            color: #d4af37;
        }

        .search-box {
            position: absolute;
            top: 100%;
            right: 0;
            width: 350px;
            background: #1a1a1a;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            border: 1px solid #d4af37;
            display: none;
            z-index: 1001;
        }

        .search-box.active {
            display: block;
            animation: searchSlide 0.3s ease;
        }

        @keyframes searchSlide {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .search-input-wrapper {
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 15px 20px 15px 50px;
            border: 1px solid #444;
            border-radius: 25px;
            background: #111;
            color: #fff;
            font-size: 16px;
            font-family: 'Poppins', sans-serif;
            transition: border-color 0.3s;
        }

        .search-input:focus {
            outline: none;
            border-color: #d4af37;
        }

        .search-input::placeholder {
            color: #888;
        }

        .search-icon {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: #d4af37;
            font-size: 18px;
        }

        .search-close {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #888;
            font-size: 18px;
            cursor: pointer;
            transition: color 0.3s;
        }

        .search-close:hover {
            color: #d4af37;
        }

        .search-suggestions {
            margin-top: 15px;
        }

        .search-suggestions h4 {
            color: #888;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .search-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .search-tag {
            padding: 8px 15px;
            background: #2d2d2d;
            color: #ccc;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .search-tag:hover {
            background: #d4af37;
            color: #000;
        }

        /* ========== ACCOUNT / USER ICON ========== */
        .user-account {
            position: relative;
        }

        .account-btn {
            color: #fff;
            text-decoration: none;
            font-size: 16px;
            font-weight: 500;
            padding: 8px 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: color 0.3s;
            cursor: pointer;
        }

        .account-btn:hover {
            color: #d4af37;
        }

        .account-btn i {
            font-size: 18px;
        }

        /* ========== MODAL STYLES ========== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 100000;
            display: none;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            border-radius: 20px;
            padding: 40px;
            max-width: 450px;
            width: 90%;
            position: relative;
            border: 2px solid #d4af37;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            animation: modalSlide 0.3s ease;
        }

        @keyframes modalSlide {
            from {
                opacity: 0;
                transform: translateY(-50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 20px;
            color: #d4af37;
            font-size: 28px;
            cursor: pointer;
            transition: color 0.3s;
        }

        .modal-close:hover {
            color: #fff;
        }

        .modal-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .modal-header h2 {
            font-family: 'Playfair Display', serif;
            font-size: 32px;
            color: #d4af37;
            margin-bottom: 10px;
        }

        .modal-header p {
            color: #ccc;
            font-size: 14px;
        }

        .modal-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        .modal-tab {
            flex: 1;
            padding: 12px;
            background: transparent;
            border: 1px solid #d4af37;
            color: #d4af37;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            font-family: 'Poppins', sans-serif;
        }

        .modal-tab.active {
            background: #d4af37;
            color: #000;
        }

        .modal-tab:hover:not(.active) {
            background: rgba(212, 175, 55, 0.1);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #fff;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 14px 18px;
            border: 1px solid #444;
            border-radius: 10px;
            background: #111;
            color: #fff;
            font-size: 16px;
            font-family: 'Poppins', sans-serif;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #d4af37;
        }

        .form-group input::placeholder {
            color: #666;
        }

        .form-row {
            display: flex;
            gap: 15px;
        }

        .form-row .form-group {
            flex: 1;
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #d4af37 0%, #f5e6a3 50%, #d4af37 100%);
            background-size: 200% auto;
            border: none;
            border-radius: 25px;
            color: #000;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Poppins', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .submit-btn:hover {
            background-position: right center;
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(212, 175, 55, 0.4);
        }

        .social-login {
            margin-top: 25px;
            text-align: center;
        }

        .social-login p {
            color: #666;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .social-btns {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .social-btns button {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 1px solid #444;
            background: #111;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .social-btns button:hover {
            border-color: #d4af37;
            color: #d4af37;
            transform: translateY(-3px);
        }

        .forgot-password {
            text-align: center;
            margin-top: 20px;
        }

        .forgot-password a {
            color: #d4af37;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s;
        }

        .forgot-password a:hover {
            color: #fff;
        }

        .modal-form {
            display: none;
        }

        .modal-form.active {
            display: block;
        }

        /* USER PROFILE DROPDOWN */
        .user-dropdown {
            position: absolute;
            top: 100%;
            right: 0;
            background: #1a1a1a;
            border-radius: 15px;
            padding: 20px;
            min-width: 250px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            border: 1px solid #d4af37;
            display: none;
            z-index: 1001;
        }

        .user-dropdown.active {
            display: block;
            animation: dropdownSlide 0.3s ease;
        }

        @keyframes dropdownSlide {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .user-dropdown-header {
            text-align: center;
            padding-bottom: 15px;
            border-bottom: 1px solid #333;
            margin-bottom: 15px;
        }

        .user-avatar {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: linear-gradient(135deg, #d4af37, #f5e6a3);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 10px;
            font-size: 28px;
            font-weight: 700;
            color: #000;
        }

        .user-dropdown-header h4 {
            color: #d4af37;
            font-size: 18px;
            margin-bottom: 5px;
        }

        .user-dropdown-header p {
            color: #888;
            font-size: 12px;
        }

        .dropdown-menu {
            list-style: none;
        }

        .dropdown-menu li {
            margin-bottom: 5px;
        }

        .dropdown-menu a {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 15px;
            color: #ccc;
            text-decoration: none;
            border-radius: 8px;
            transition: all 0.3s;
            font-size: 14px;
        }

        .dropdown-menu a:hover {
            background: rgba(212, 175, 55, 0.1);
            color: #d4af37;
        }

        .dropdown-menu a i {
            width: 20px;
            color: #d4af37;
        }

        .dropdown-divider {
            height: 1px;
            background: #333;
            margin: 10px 0;
        }

        .logout-btn {
            background: #d4af37 !important;
            color: #000 !important;
            font-weight: 600;
            text-align: center;
            justify-content: center;
            cursor: pointer;
        }

        .logout-btn:hover {
            background: #f5e6a3 !important;
            color: #000 !important;
        }

        /* LOGGED IN STATE */
